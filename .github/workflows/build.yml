# Builds Age of Tower Defense on every push: balance bots, then an Android APK and a Windows .exe.
#
# Easy updates: upload a file named game.zip (the project zip Claude sends) to the repo root.
# This workflow unpacks it over the repo before building, so folder structure never gets lost
# in the browser uploader.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack game.zip if one was uploaded
        run: |
          if [ -f game.zip ]; then
            # remove loose files left by earlier flattened uploads (the real project has no root-level .png/.py)
            rm -f ./*.png ./*.py
            rm -rf /tmp/game && mkdir -p /tmp/game
            unzip -q -o game.zip -d /tmp/game
            src=/tmp/game
            [ -d /tmp/game/age-of-tower-defense ] && src=/tmp/game/age-of-tower-defense
            cp -a "$src"/. .
            rm -f game.zip
            echo "Unpacked game.zip"
          fi
          echo "GAME_VERSION=$(grep -oP 'config/version="\K[^"]+' project.godot || echo dev)" >> $GITHUB_ENV
          grep config/version project.godot || true
          ls data

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f Godot_v*.zip Godot_v*.tpz

      - name: Android SDK path and signing key
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          done
          # Same key every build, so each new APK installs as an update over the previous one.
          KS="$GITHUB_WORKSPACE/android/debug.keystore"
          if [ ! -f "$KS" ]; then
            KS="$RUNNER_TEMP/debug.keystore"
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import assets
        run: godot --headless --path . --import || true

      - name: Balance bots (all maps)
        run: |
          for m in $(ls data/map_*.json | sed 's#data/map_##; s#\.json##'); do
            godot --headless --path . --script res://tests/balance.gd -- $m | grep -E "^===|result" || true
          done

      - name: Export Android APK and Windows build
        run: |
          mkdir -p build/android build/windows
          godot --headless --path . --export-debug "Android" build/android/AgeOfTowerDefense-v${GAME_VERSION}.apk
          godot --headless --path . --export-release "Windows Desktop" build/windows/AgeOfTowerDefense-v${GAME_VERSION}.exe
          ls -la build/android build/windows
          test -s build/android/AgeOfTowerDefense-v${GAME_VERSION}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgeOfTowerDefense-Android-v${{ env.GAME_VERSION }}
          path: build/android/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgeOfTowerDefense-Windows-v${{ env.GAME_VERSION }}
          path: build/windows/*.exe
